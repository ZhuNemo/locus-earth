// ============================================================================
// Locus Earth Android 外壳 —— GitHub Actions 构建
// ----------------------------------------------------------------------------
// 触发方式：
//   · 手动：Actions → Build Android APK → Run workflow
//   · 打 tag：git tag v1.0 && git push origin v1.0
//
// 签名（可选，配了就用 release 签名，没配就自动回退 debug 签名）：
//   Settings → Secrets and variables → Actions 里加四个 secret：
//     ANDROID_KEYSTORE_BASE64     ← keytool 生成的 .jks 文件做 base64 后的内容
//     ANDROID_KEYSTORE_PASSWORD
//     ANDROID_KEY_ALIAS
//     ANDROID_KEY_PASSWORD
//   本机生成 base64（Windows Git Bash）：base64 -w0 release.jks > ks.txt
// ============================================================================
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: assembleRelease
    runs-on: ubuntu-latest

    # 所有 run 步骤都默认在 androidapk/ 下执行（uses 步骤不受影响）
    defaults:
      run:
        working-directory: androidapk

    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare gradle wrapper
        run: chmod +x gradlew

      - name: Restore keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: locus-earth-android-release
          path: androidapk/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
