<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locus Earth - 设置</title>
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.json" />

    <!-- Montserrat（仅拉丁字符），国内镜像，详见 index.html 同处的说明 -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Montserrat:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/toast.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/themes.css" />
</head>
<body class="settings-body">

    <!-- 内联 SVG 图标库（与 index.html 同源同规范，全站无 emoji） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </symbol>
        </defs>
    </svg>

    <header class="settings-header">
        <button id="backBtn" class="back-btn" aria-label="返回主页面">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </button>
        <div class="settings-title">
            <h1><svg class="ui-icon"><use href="#i-gear"/></svg>设置</h1>
            <p>若设置项未生效，重新开关即可恢复</p>
        </div>
    </header>

    <main class="settings-container">
        <div class="setting-group">

            <!-- 跟随系统 -->
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-label">跟随系统</span>
                    <span class="setting-desc">自动跟随系统深色/浅色模式</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="followSystem" checked />
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <!-- 色彩模式 -->
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-label">色彩模式</span>
                    <span class="setting-desc">手动选择深色或浅色模式</span>
                </div>
                <select id="colorMode" disabled>
                    <option value="light">浅色</option>
                    <option value="dark">深色</option>
                </select>
            </div>

            <!-- 地形开关 -->
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-label">地形开关</span>
                    <span class="setting-desc">关闭可提升加载速度，但存在建模和OSM建筑悬空的问题，并非建筑损坏</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="terrainToggle" />
                    <span class="toggle-slider"></span>
                </label>
            </div>
            
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-label">路网叠加层</span>
                    <span class="setting-desc">来自天地图的路网和叠加层，覆盖中国路网和地名、全球边界和行政区名</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="overlayToggle" />
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-label">清除缓存与数据</span>
                    <span class="setting-desc">可清理需要清除的缓存对象</span>
                </div>
                <button id="clearCacheBtn" class="setting-action" type="button">进入</button>
            </div>

        </div>

        <!-- 清除缓存弹窗 -->
        <div id="clearCacheModal" class="modal">
        <div class="modal-content">
            <h2>清除缓存与数据</h2>
            <p style="color: #888; font-size: 0.9rem;">请选择需要清除的项目：</p>
            
            <label>
                <input type="checkbox" id="clearAppCache" checked>
                <span class="setting-info">
                    <span class="setting-label">清除应用缓存</span>
                    <span class="setting-desc">(较小，含界面更新)</span>
                </span>
            </label>

            <label>
                <input type="checkbox" id="clearCesiumCache">
                <span class="setting-info">
                    <span class="setting-label">清除 Cesium 地球引擎缓存</span>
                    <span class="setting-desc">(较大，清除后刷新需要重新下载引擎，建议仅在遇到错误时使用)</span>
                </span>
            </label>

            <label>
                <input type="checkbox" id="clearBookmarks">
                <span class="setting-info">
                    <span class="setting-label">清除收藏标记数据</span>
                    <span class="setting-desc">(将删除保存的所有地点标记。若需删除部分标记，请前往收藏页面操作)</span>
                </span>
            </label>

            <label>
                <input type="checkbox" id="clearSettings">
                <span class="setting-info">
                    <span class="setting-label">清除设置数据</span>
                    <span class="setting-desc">(将恢复默认主题和默认地形开关)</span>
                </span>
            </label>

            <div class="modal-buttons">
            <button id="confirmClearBtn">确认清除</button>
            <button id="cancelClearBtn">取消</button>
            </div>
        </div>
        </div>
    </main>

    <!-- 提示浮层（结构/样式与主页面 toast 一致，供设置页提示使用） -->
    <div id="toastMessage" class="toast-message"></div>

    <script src="js/settings.js"></script>
</body>
</html>
